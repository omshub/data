name: Crawl OMSCS Catalog

on:
  # Run weekly on Mondays at 9am UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: crawl-omscs-catalog
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx

      - name: Prepare catalog update branch
        id: prepare-branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Christian Tran'
          git config user.email 'ctran4347@gmail.com'
          git fetch origin main:refs/remotes/origin/main

          EXISTING_PR_NUMBER=$(gh pr list \
            --state open \
            --base main \
            --json number,headRefName \
            --jq 'map(select(.headRefName | startswith("catalog-update"))) | sort_by(.number) | last | .number // ""')

          if [ -n "$EXISTING_PR_NUMBER" ]; then
            BRANCH_NAME=$(gh pr view "$EXISTING_PR_NUMBER" --json headRefName --jq '.headRefName')
            echo "Updating existing catalog PR #$EXISTING_PR_NUMBER on $BRANCH_NAME"
            git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            git pull --ff-only origin "$BRANCH_NAME"
          else
            BRANCH_NAME="catalog-update"
            echo "No existing catalog PR found; using $BRANCH_NAME"

            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
              git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
              git checkout "$BRANCH_NAME"
              git pull --ff-only origin "$BRANCH_NAME"
            else
              git checkout -b "$BRANCH_NAME"
            fi
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "existing_pr_number=$EXISTING_PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Save current catalog state
        run: |
          if git cat-file -e origin/main:static/courses.json 2>/dev/null; then
            git show origin/main:static/courses.json > /tmp/courses-before.json
          else
            echo '{}' > /tmp/courses-before.json
          fi

      - name: Run catalog crawler
        run: npx tsx catalog/crawler.ts

      - name: Detect new courses
        id: detect-changes
        run: |
          NEW_COURSES=$(node -e "
            const fs = require('fs');

            let before = {};
            let after = {};

            try {
              before = JSON.parse(fs.readFileSync('/tmp/courses-before.json', 'utf8'));
            } catch (e) {
              before = {};
            }

            try {
              after = JSON.parse(fs.readFileSync('static/courses.json', 'utf8'));
            } catch (e) {
              after = {};
            }

            const beforeIds = new Set(Object.keys(before));
            const newCourses = Object.keys(after)
              .filter(id => !beforeIds.has(id))
              .map(id => '- **' + id + '** ' + after[id].name);

            if (newCourses.length > 0) {
              console.log(newCourses.join('\n'));
            }
          ")

          echo "$NEW_COURSES" > /tmp/new-courses.txt

          if [ -n "$NEW_COURSES" ]; then
            echo "has_new_courses=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_courses=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update catalog PR
        id: publish-catalog-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.prepare-branch.outputs.branch_name }}
          EXISTING_PR_NUMBER: ${{ steps.prepare-branch.outputs.existing_pr_number }}
        run: |
          ACTIVE_PR_NUMBER="$EXISTING_PR_NUMBER"
          git add static/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            git commit -m "Update OMSCS catalog $TIMESTAMP"
            git push -u origin HEAD:"$BRANCH_NAME"

            NEW_COURSES=$(cat /tmp/new-courses.txt)

            if [ -n "$NEW_COURSES" ]; then
              {
                echo "Automated update of OMSCS catalog data."
                echo ""
                echo "## New Courses"
                echo "$NEW_COURSES"
                echo ""
                echo "## Changes"
                echo "- Updated course and specialization data from omscs.gatech.edu"
                echo ""
                echo "## Auto-generated"
                echo "This PR was automatically created by the OMSCS Catalog crawler GitHub Action."
              } > /tmp/pr-body.md
            else
              {
                echo "Automated update of OMSCS catalog data."
                echo ""
                echo "## Changes"
                echo "- Updated course and specialization data from omscs.gatech.edu"
                echo "- No new courses detected (metadata updates only)"
                echo ""
                echo "## Auto-generated"
                echo "This PR was automatically created by the OMSCS Catalog crawler GitHub Action."
              } > /tmp/pr-body.md
            fi

            if [ -n "$EXISTING_PR_NUMBER" ]; then
              gh pr edit "$EXISTING_PR_NUMBER" \
                --title "Update OMSCS catalog" \
                --body-file /tmp/pr-body.md
            else
              gh pr create \
                --title "Update OMSCS catalog" \
                --body-file /tmp/pr-body.md \
                --base main \
                --head "$BRANCH_NAME"
              ACTIVE_PR_NUMBER=$(gh pr view "$BRANCH_NAME" --json number --jq '.number')
            fi
          fi

          echo "active_pr_number=$ACTIVE_PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Close duplicate catalog PRs
        if: steps.publish-catalog-pr.outputs.active_pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_PR_NUMBER: ${{ steps.publish-catalog-pr.outputs.active_pr_number }}
        run: |
          DUPLICATE_PR_NUMBERS=$(gh pr list \
            --state open \
            --base main \
            --json number,headRefName \
            --jq ".[] | select(.number != ${ACTIVE_PR_NUMBER}) | select(.headRefName | startswith(\"catalog-update\")) | .number")

          if [ -z "$DUPLICATE_PR_NUMBERS" ]; then
            echo "No duplicate catalog PRs to close"
            exit 0
          fi

          for PR_NUMBER in $DUPLICATE_PR_NUMBERS; do
            gh pr close "$PR_NUMBER" \
              --comment "Closing as a duplicate catalog crawler PR. Future catalog runs update #${ACTIVE_PR_NUMBER} instead of opening another timestamped PR."
          done
